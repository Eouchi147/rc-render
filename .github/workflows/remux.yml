# Replace a finished film's sound without re-rendering the picture: takes <id>.mp4 from the release "kino-films",
# lays the film folder's current audio (film.json "audio" at the given kinoforge ref) and republishes <id>.mp4 and
# <id>-preview.mp4. Use after a re-score or a re-mix.
name: remux
on:
  workflow_dispatch:
    inputs:
      film: {description: 'film folder in kinoforge, e.g. films/battles/cannae', required: true}
      ref: {description: 'kinoforge branch or FULL commit hash', default: 'main'}
permissions:
  contents: write
  actions: read
jobs:
  remux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {repository: Eouchi147/kinoforge, ref: '${{ inputs.ref }}', sparse-checkout: '${{ inputs.film }}'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: remux
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', FILM: '${{ inputs.film }}'}
        run: |
          ID=$(python3 -c "import json;print(json.load(open('$FILM/film.json'))['id'])")
          AUD=$(python3 -c "import json;print(json.load(open('$FILM/film.json')).get('audio') or '')")
          test -n "$AUD" && test -f "$FILM/$AUD"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILM/$AUD"
          gh release download kino-films -p "$ID.mp4" -O old.mp4
          ffmpeg -nostdin -y -loglevel error -i old.mp4 -i "$FILM/$AUD" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -shortest -movflags +faststart "$ID.mp4"
          PV='scale=540:-2'; W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$ID.mp4"); case "$W" in 1920,*) PV='scale=960:-2';; esac
          ffmpeg -nostdin -y -loglevel error -i "$ID.mp4" -vf "$PV" -c:v libx264 -crf 24 -c:a aac -b:a 128k -movflags +faststart "$ID-preview.mp4"
          ls -la *.mp4
          gh release upload kino-films "$ID.mp4" "$ID-preview.mp4" --clobber
      - name: spend record
        # <id>-run.json in kino-films: this run's jobs and minutes, appended to the film's earlier runs, for KINOFORGE
        # tools/spend.py (spend per video). Never fails the render.
        continue-on-error: true
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', RUN_ID: '${{ github.run_id }}', WF: remux.yml, FOLDER: '${{ inputs.film }}'}
        run: |
          export FID=$(python3 -c "import json;print(json.load(open('$FOLDER/film.json'))['id'])")
          gh release download kino-films -p "$FID-run.json" -O old-run.json --clobber 2>/dev/null || true
          python3 - <<'EOF'
          import json, math, os, time, urllib.request, datetime as dt
          env = os.environ; fid, rid = env['FID'], int(env['RUN_ID'])
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Bearer ' + env['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}), timeout=60))
          jobs, page = [], 1
          while True:
              j = get(f"https://api.github.com/repos/{env['GH_REPO']}/actions/runs/{rid}/jobs?per_page=100&page={page}"); jobs += j['jobs']; page += 1
              if not j['jobs'] or len(jobs) >= j['total_count']: break
          now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()); t = lambda s: dt.datetime.strptime(s, '%Y-%m-%dT%H:%M:%SZ')
          rows = [{'name': x['name'], 'started_at': x['started_at'], 'completed_at': x['completed_at'] or now, 'conclusion': x['conclusion'] or 'running when recorded',
                   'labels': x['labels'], 'seconds': int((t(x['completed_at'] or now) - t(x['started_at'])).total_seconds())} for x in jobs if x.get('started_at')]
          rec = {'run_id': rid, 'repo': env['GH_REPO'], 'workflow': env['WF'], 'folder': env['FOLDER'], 'runner': 'GitHub-hosted ' + ', '.join(sorted({l for r in rows for l in r['labels']})),
                 'started': min(r['started_at'] for r in rows), 'ended': now, 'jobs': rows, 'seconds': sum(r['seconds'] for r in rows),
                 'minutes': sum(math.ceil(r['seconds'] / 60) for r in rows)}
          old = json.load(open('old-run.json')) if os.path.exists('old-run.json') else {}
          runs = [r for r in old.get('runs', []) if r.get('run_id') != rid] + [rec]
          json.dump({'film': fid, 'runs': runs}, open(f'{fid}-run.json', 'w'), indent=1); print(fid, 'run', rid, rec['minutes'], 'min in', len(rows), 'jobs')
          EOF
          gh release upload kino-films "$FID-run.json" --clobber
