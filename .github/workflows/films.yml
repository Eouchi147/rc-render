# KINOFORGE films rendered on free runners: Dark Corners re-made in the KINOFORGE styles, and the Battle Map series.
# The scenes live in the public repo Eouchi147/kinoforge (films/<series>/<id>/: film.json + index.html or blender.py).
# Each matrix job renders one stretch of frames and encodes it; the join job glues the parts, lays the film's own
# soundtrack (film.json "audio"), scales to the delivery size and publishes to the release "kino-films".
name: films
on:
  workflow_dispatch:
    inputs:
      film: {description: 'film folder in kinoforge, e.g. films/dark-corners/zong', required: true}
      parts: {description: 'parallel parts', default: '12'}
      ref: {description: 'kinoforge branch or commit', default: 'main'}
permissions:
  contents: write
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      meta: ${{ steps.p.outputs.meta }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: Eouchi147/kinoforge, ref: '${{ inputs.ref }}', sparse-checkout: '${{ inputs.film }}'}
      - id: p
        env: {FILM: '${{ inputs.film }}', PARTS: '${{ inputs.parts }}'}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, math
          f = os.environ['FILM'].rstrip('/'); m = json.load(open(f + '/film.json'))
          fps = int(m.get('fps', 24)); total = int(math.ceil(float(m['duration']) * fps)); n = max(1, int(os.environ['PARTS']))
          kind = 'blender' if os.path.exists(f + '/blender.py') else 'web'
          meta = {'film': f, 'id': m['id'], 'kind': kind, 'w': int(m['render_w']), 'h': int(m['render_h']), 'fps': fps, 'total': total,
                  'out_w': int(m.get('w', m['render_w'])), 'out_h': int(m.get('h', m['render_h'])), 'samples': int(m.get('samples', 24)),
                  'audio': m.get('audio') or '', 'inserts': m.get('inserts') or []}
          parts = [{'k': k, 'a': total * k // n, 'b': total * (k + 1) // n} for k in range(n)]
          print('parts=' + json.dumps(parts)); print('meta=' + json.dumps(meta))
          EOF
          cat "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: part ${{ matrix.part.k }}
    env:
      FILM: ${{ fromJson(needs.plan.outputs.meta).film }}
      KIND: ${{ fromJson(needs.plan.outputs.meta).kind }}
      W: ${{ fromJson(needs.plan.outputs.meta).w }}
      H: ${{ fromJson(needs.plan.outputs.meta).h }}
      FPS: ${{ fromJson(needs.plan.outputs.meta).fps }}
      SAMPLES: ${{ fromJson(needs.plan.outputs.meta).samples }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: Eouchi147/kinoforge, ref: '${{ inputs.ref }}'}
      - uses: actions/setup-node@v4
        if: env.KIND == 'web'
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: tools
        run: |
          exec > >(tee -a job.log) 2>&1; set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          if [ "$KIND" = "web" ]; then npm ci --prefix harness --no-audit --no-fund && (cd harness && npx playwright install --with-deps chromium > /dev/null); fi
          if [ "$KIND" = "blender" ]; then
            sudo apt-get install -y -qq libegl1 libgl1 libglu1-mesa libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgomp1 > /dev/null
            pip install -q numpy bpy==5.2.2 && python3 -c "import bpy; print('bpy', bpy.app.version_string)"
          fi
      - name: render frames ${{ matrix.part.a }} to ${{ matrix.part.b }}
        run: |
          exec > >(tee -a job.log) 2>&1
          mkdir -p out/part
          if [ "$KIND" = "web" ]; then
            node harness/render.cjs "$FILM" --out out/part --w $W --h $H --fps $FPS --start ${{ matrix.part.a }} --end ${{ matrix.part.b }} --jpg
          else
            python3 harness/blender_render.py "$FILM" --out out/part --w $W --h $H --fps $FPS --samples $SAMPLES --start ${{ matrix.part.a }} --end ${{ matrix.part.b }} 2>&1 | grep -v -E '^(Fra:|EGL|Error: EGL)'; test ${PIPESTATUS[0]} -eq 0
          fi
          E=jpg; ls out/part/frames/*.png > /dev/null 2>&1 && E=png
          ffmpeg -nostdin -y -loglevel error -framerate $FPS -start_number ${{ matrix.part.a }} -i out/part/frames/%05d.$E \
            -frames:v $(( ${{ matrix.part.b }} - ${{ matrix.part.a }} )) -c:v libx264 -preset medium -crf 12 -pix_fmt yuv420p part_$(printf %03d ${{ matrix.part.k }}).mp4
          ls -la part_*.mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'part-${{ matrix.part.k }}', path: 'part_*.mp4', retention-days: 3}
      - name: keep the log
        if: failure()
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: 'Eouchi147/rc-render'}
        run: |
          gh release view film-logs > /dev/null 2>&1 || gh release create film-logs --title film-logs --notes "Failed film render logs." || true
          N=$(basename "$FILM")-part-${{ matrix.part.k }}.log; tail -c 60000 job.log > "$N" || echo none > "$N"; gh release upload film-logs "$N" --clobber || true
  join:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      META: ${{ needs.plan.outputs.meta }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: Eouchi147/kinoforge, ref: '${{ inputs.ref }}', sparse-checkout: '${{ fromJson(needs.plan.outputs.meta).film }}'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with: {path: parts, pattern: 'part-*', merge-multiple: true}
      - name: join, sound, scale
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          python3 - <<'EOF'
          import json, os, glob, subprocess
          m = json.loads(os.environ['META']); fid = m['id']
          parts = sorted(glob.glob('parts/part_*.mp4')); open('list.txt', 'w').write(''.join(f"file '{p}'\n" for p in parts))
          run = lambda a: subprocess.run(['ffmpeg', '-nostdin', '-y', '-loglevel', 'error'] + a, check=True)
          run(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'picture.mp4'])
          # inserts: finished clips from this release laid over exact frame spans (film.json "inserts": [{film, first, last}])
          if m.get('inserts'):
              ins_args, fc, last = [], [], '0:v'
              for k, it in enumerate(m['inserts']):
                  subprocess.run(['gh', 'release', 'download', 'kino-films', '-p', it['film'] + '.mp4', '-O', f'ins{k}.mp4', '--clobber'], check=True)
                  ins_args += ['-i', f'ins{k}.mp4']; a, b = int(it['first']), int(it['last'])
                  fc.append(f"[{k+1}:v]scale={m['w']}:{m['h']}:flags=lanczos,trim=end_frame={b-a+1},setpts=PTS-STARTPTS+{a}/{m['fps']}/TB[s{k}]")
                  # enable by time, not by n: in a chain of overlays the second overlay's n does not count the main frames
                  # (Agincourt 23 Oct: insert B never showed); half a frame of margin on each side keeps it frame-exact
                  fps = float(m['fps']); fc.append(f"[{last}][s{k}]overlay=enable='between(t,{(a - 0.5) / fps:.6f},{(b + 0.5) / fps:.6f})':eof_action=pass[v{k}]"); last = f'v{k}'
              run(['-i', 'picture.mp4'] + ins_args + ['-filter_complex', ';'.join(fc), '-map', f'[{last}]', '-c:v', 'libx264', '-preset', 'medium', '-crf', '12', '-pix_fmt', 'yuv420p', 'picture2.mp4'])
              os.replace('picture2.mp4', 'picture.mp4'); print('inserts laid:', m['inserts'])
          aud = os.path.join(m['film'], m['audio']) if m['audio'] else None
          ins = ['-i', 'picture.mp4'] + (['-i', aud] if aud and os.path.exists(aud) else [])
          vf = f"scale={m['out_w']}:{m['out_h']}:flags=lanczos"
          a = ['-map', '0:v', '-map', '1:a', '-c:a', 'aac', '-b:a', '256k', '-shortest'] if len(ins) > 2 else []
          run(ins + ['-vf', vf, '-c:v', 'libx264', '-preset', 'slow', '-crf', '17', '-maxrate', '16M', '-bufsize', '32M', '-pix_fmt', 'yuv420p', '-movflags', '+faststart'] + a + [f'{fid}.mp4'])
          pv = 'scale=540:-2' if m['out_h'] > m['out_w'] else 'scale=960:-2'
          run(['-i', f'{fid}.mp4', '-vf', pv, '-c:v', 'libx264', '-crf', '24', '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', f'{fid}-preview.mp4'])
          run(['-i', f'{fid}.mp4', '-vf', "fps=1/6,scale=240:-2,tile=8x4", '-frames:v', '1', f'{fid}-sheet.jpg'])
          d = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', f'{fid}.mp4'], capture_output=True, text=True).stdout
          # poster for the web studio's library: the title card + 2 s (cues.json title_line), else 30 % into the film; never fails the join
          try:
              dd = float(d or 0); t = dd * 0.3; cp = os.path.join(m['film'], 'cues.json')
              if os.path.exists(cp):
                  c = json.load(open(cp)); tl = next((l for l in c.get('lines', []) if l['id'] == c.get('title_line')), None)
                  if tl: t = min(dd - 0.5, tl['start'] + 2.0)
              pw = 'scale=540:-2' if m['out_h'] > m['out_w'] else 'scale=960:-2'
              run(['-ss', f'{max(0.0, t):.2f}', '-i', f'{fid}.mp4', '-frames:v', '1', '-vf', pw, '-q:v', '3', f'{fid}-poster.jpg'])
          except Exception as e: print('no poster:', e)
          print(fid, 'duration', d, 'frames expected', m['total'], 'parts', len(parts))
          EOF
          ls -la *.mp4 *.jpg
      - name: publish
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          gh release view kino-films > /dev/null 2>&1 || gh release create kino-films --title "kino-films" --notes "KINOFORGE films: Dark Corners in the KINOFORGE styles, and the Battle Map series. Scenes in Eouchi147/kinoforge films/." || true
          for f in *-sheet.jpg $(ls *-poster.jpg 2>/dev/null) $(ls *.mp4 | grep -v "^picture.mp4$"); do gh release upload kino-films "$f" --clobber; done
      - name: spend record
        # <id>-run.json in kino-films: this run's jobs and minutes, appended to the film's earlier runs, for KINOFORGE
        # tools/spend.py (spend per video). Never fails the render.
        continue-on-error: true
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', RUN_ID: '${{ github.run_id }}', WF: films.yml,
              FID: '${{ fromJson(needs.plan.outputs.meta).id }}', FOLDER: '${{ inputs.film }}'}
        run: |
          gh release download kino-films -p "$FID-run.json" -O old-run.json --clobber 2>/dev/null || true
          python3 - <<'EOF'
          import json, math, os, time, urllib.request, datetime as dt
          env = os.environ; fid, rid = env['FID'], int(env['RUN_ID'])
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Bearer ' + env['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}), timeout=60))
          jobs, page = [], 1
          while True:
              j = get(f"https://api.github.com/repos/{env['GH_REPO']}/actions/runs/{rid}/jobs?per_page=100&page={page}"); jobs += j['jobs']; page += 1
              if not j['jobs'] or len(jobs) >= j['total_count']: break
          now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()); t = lambda s: dt.datetime.strptime(s, '%Y-%m-%dT%H:%M:%SZ')
          rows = [{'name': x['name'], 'started_at': x['started_at'], 'completed_at': x['completed_at'] or now, 'conclusion': x['conclusion'] or 'running when recorded',
                   'labels': x['labels'], 'seconds': int((t(x['completed_at'] or now) - t(x['started_at'])).total_seconds())} for x in jobs if x.get('started_at')]
          rec = {'run_id': rid, 'repo': env['GH_REPO'], 'workflow': env['WF'], 'folder': env['FOLDER'], 'runner': 'GitHub-hosted ' + ', '.join(sorted({l for r in rows for l in r['labels']})),
                 'started': min(r['started_at'] for r in rows), 'ended': now, 'jobs': rows, 'seconds': sum(r['seconds'] for r in rows),
                 'minutes': sum(math.ceil(r['seconds'] / 60) for r in rows)}
          old = json.load(open('old-run.json')) if os.path.exists('old-run.json') else {}
          runs = [r for r in old.get('runs', []) if r.get('run_id') != rid] + [rec]
          json.dump({'film': fid, 'runs': runs}, open(f'{fid}-run.json', 'w'), indent=1); print(fid, 'run', rid, rec['minutes'], 'min in', len(rows), 'jobs')
          EOF
          gh release upload kino-films "$FID-run.json" --clobber
