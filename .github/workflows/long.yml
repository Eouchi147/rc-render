name: long
# A long film (16:9, 8 to 12 minutes) on many machines: prep (compile, voice, timing, mix) once, then N chunk jobs that
# film their own stretch of frames at the same time, then assemble (join, sound, chapters, QA) and publish to the release.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Long film id (e.g. lf-gobekli)"
        required: true
      mod:
        description: "Its module under reels/films (e.g. long.lf_gobekli)"
        required: true
      chunks:
        description: "How many machines film it"
        default: "8"
permissions:
  contents: write
concurrency:
  group: long-${{ inputs.id }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ks: ${{ steps.k.outputs.ks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: farm/requirements.txt
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r farm/requirements.txt
      - name: models cache
        id: mc
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-r11-v1
      - name: models
        if: steps.mc.outputs.cache-hit != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p models
          for s in a{a..z} b{a..i}; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 -o models/kokoro-v1.0-r11.onnx.part-$s \
              "https://github.com/${GH_REPO}/releases/download/models/kokoro-v1.0-r11.onnx.part-$s"
          done
          cat models/kokoro-v1.0-r11.onnx.part-* > models/kokoro-v1.0-r11.onnx && rm models/kokoro-v1.0-r11.onnx.part-*
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  models/kokoro-v1.0-r11.onnx" | sha256sum -c
      - name: prep
        run: bash farm/long.sh prep "${{ inputs.id }}" "${{ inputs.mod }}"
      - id: k
        env:
          N: ${{ inputs.chunks }}
        run: echo "ks=$(python3 -c 'import os,json;print(json.dumps(list(range(1,int(os.environ["N"])+1))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ inputs.id }}
          path: build/bundle
          retention-days: 3
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-prep-${{ inputs.id }}
          path: build/*.log
  chunk:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        k: ${{ fromJson(needs.prep.outputs.ks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: farm/requirements.txt
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r farm/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ inputs.id }}
          path: build/bundle
      - name: film
        run: bash farm/long.sh chunk "${{ matrix.k }}" "${{ inputs.chunks }}"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ inputs.id }}-${{ matrix.k }}
          path: |
            build/bundle/seg_${{ matrix.k }}_of_${{ inputs.chunks }}.mp4
            build/bundle/seg_${{ matrix.k }}_of_${{ inputs.chunks }}.json
          retention-days: 3
  assemble:
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: farm/requirements.txt
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r farm/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ inputs.id }}
          path: build/bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-${{ inputs.id }}-*
          path: build/bundle
          merge-multiple: true
      - name: assemble
        run: bash farm/long.sh assemble "${{ inputs.id }}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view films >/dev/null 2>&1 || gh release create films --title "Rendered films" --notes "Finished films and their sound packs, one asset per film."
          gh release upload films build/${{ inputs.id }}.mp4 build/${{ inputs.id }}.chapters.txt build/${{ inputs.id }}.description.txt build/${{ inputs.id }}.qa.json --clobber
