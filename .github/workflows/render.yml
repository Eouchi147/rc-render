name: render
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Film ids, separated by commas or spaces"
        required: true
      hear:
        description: "Run the pronunciation hear-check (1) or not (0)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: render-${{ github.run_id }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - id: m
        env:
          IDS: ${{ inputs.ids }}
        run: echo "ids=$(python3 -c 'import os,json,re;print(json.dumps([x for x in re.split(r"[,\s]+",os.environ["IDS"]) if x]))')" >> "$GITHUB_OUTPUT"
      - name: release for the films
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view films >/dev/null 2>&1 || gh release create films --title "Rendered films" --notes "Finished films and their sound packs, one asset per film."
  film:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: farm/requirements.txt
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r farm/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: models cache
        id: mc
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-r11-v1
      - name: models
        if: steps.mc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p models
          gh release download models -p 'kokoro-v1.0-r11.onnx.part-*' -D models
          cat models/kokoro-v1.0-r11.onnx.part-* > models/kokoro-v1.0-r11.onnx && rm models/kokoro-v1.0-r11.onnx.part-*
          curl -sL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  models/kokoro-v1.0-r11.onnx" | sha256sum -c
      - name: render
        env:
          RC_HEAR: ${{ inputs.hear }}
        run: mkdir -p build && bash farm/run_one.sh ${{ matrix.id }}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload films build/${{ matrix.id }}.mp4 build/${{ matrix.id }}.pack.tgz --clobber
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: build/*.log
